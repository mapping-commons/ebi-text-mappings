name: Update mappings

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Outputs are NOT wiped beforehand: if a source fails to download the
      # script keeps its previously committed file and exits non-zero.
      - name: Build SSSOM mappings
        id: build
        continue-on-error: true
        run: python scripts/build_sssom.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mappings/ mappings.yml
          git diff --cached --quiet || git commit -m "Update mappings $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: Fail the run if any source failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::One or more sources failed to build; see the build step log"
          exit 1
